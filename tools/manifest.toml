homepage = "https://github.com/gitleaks/gitleaks"
install_hint = { tr = "Git geçmişindeki sırları taramak için gitleaks'i kurun: 'secscope tools install gitleaks'.", en = "Install gitleaks to scan git history for secrets: 'secscope tools install gitleaks'." }

