# Hooks run the exact tool versions pinned in uv.lock.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest-unit
        name: unit tests
        entry: uv run pytest -q tests/unit
        language: system
        pass_filenames: false
        stages: [pre-push]
