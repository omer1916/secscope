[project]
name = "secscope"
dynamic = ["version"]
description = "Local-only desktop security, SEO and resilience testing platform for your own web projects."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Ömer Daştan" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "bandit>=1.9.4",
    "defusedxml>=0.7.1",
    "httpx>=0.28",
    "jinja2>=3.1.6",
    "packaging>=26.3",
    "platformdirs>=4.3",
    "protego>=0.7.0",
    "psutil>=7.2.2",
    "pydantic>=2.9",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.8",
    "pyyaml>=6.0.3",
    "selectolax>=1.0.0",
]

[project.scripts]
secscope = "secscope.cli:main"

[project.gui-scripts]
secscope-gui = "secscope.ui.app:main"

[dependency-groups]
dev = [
    "hypothesis>=6.112",
    "jsonschema>=4.26.0",
    "pre-commit>=4.0",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.8",
    "types-defusedxml>=0.7.0.20260504",
    "types-psutil>=7.2.2.20260906",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/secscope/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/secscope"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Fixtures are deliberately insecure test targets: never lint, format or "fix" them.
extend-exclude = ["fixtures"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT", "PTH", "TID", "C4", "PL",
]
ignore = [
    "E501",     # line length is the formatter's job (ruff format); fmt: skip tables may be wider
    "SIM102",   # nested ifs are sometimes clearer for multi-step guards
    "PLR0915",  # long AST visitors / module run() methods read top-to-bottom
    "PLR0917",  # positional-argument count: internal helpers
    "PLR0911",  # many returns: guard-clause decision functions read best that way
    "PLR0912",  # many branches: same
    "PLR0913",  # too many arguments: models/CLI legitimately take many
    "PLR2004",  # magic values in comparisons: thresholds are documented in SPEC
    "S101",     # assert is fine outside of runtime-critical paths; tests rely on it
]

# Turkish UI/reason text legitimately uses the dotless i.
allowed-confusables = ["ı", "×", "–"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "N802", "TID251"]
# The only places allowed to touch raw network primitives (ADR-001, ADR-006).
"src/secscope/core/scope_guard.py" = ["TID251"]
"src/secscope/core/downloader.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# Scope Guard rule (SPEC §4.1): network primitives are only allowed inside
# secscope.core.scope_guard. Everything else must use ScopedHttpClient.
# `tests/unit/test_network_ban.py` enforces the same rule via AST scanning so it
# cannot be silenced with a `noqa`.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"socket".msg = "Use secscope.core.scope_guard (ScopedHttpClient / scoped sockets) instead."
"urllib.request".msg = "Use secscope.core.scope_guard.ScopedHttpClient instead."
"http.client".msg = "Use secscope.core.scope_guard.ScopedHttpClient instead."
"httpx.Client".msg = "Use secscope.core.scope_guard.ScopedHttpClient instead."
"httpx.AsyncClient".msg = "Use secscope.core.scope_guard.ScopedHttpClient instead."
"httpx.get".msg = "Use secscope.core.scope_guard.ScopedHttpClient instead."
"httpx.post".msg = "Use secscope.core.scope_guard.ScopedHttpClient instead."
"httpx.request".msg = "Use secscope.core.scope_guard.ScopedHttpClient instead."
"httpx.stream".msg = "Use secscope.core.scope_guard.ScopedHttpClient instead."
"requests".msg = "Use secscope.core.scope_guard.ScopedHttpClient instead."
"aiohttp".msg = "Use secscope.core.scope_guard.ScopedHttpClient instead."

# ------------------------------------------------------------------------- pyright
[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["fixtures", "**/node_modules", "**/__pycache__", ".venv"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false

# -------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
qt_api = "pyside6"
markers = [
    "integration: needs real external tools or a running fixture app",
    "e2e: drives the CLI or UI end to end",
    "network: needs internet access (package registries)",
]

[tool.coverage.run]
source = ["secscope"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
