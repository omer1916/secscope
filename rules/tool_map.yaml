  B324: {rule: SAST-CRYPTO-001, confidence: low}
  B304: {rule: SAST-CRYPTO-002}
  B305: {rule: SAST-CRYPTO-002}
  B501: {rule: SAST-TLS-001}
  B323: {rule: SAST-TLS-001}
