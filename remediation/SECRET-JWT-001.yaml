rule_id: SECRET-JWT-001
title:
  tr: Kodda sabit JWT token'ı
  en: Hardcoded JSON Web Token
severity: medium
category: security
confidence: high
why:
  tr: Kaynakta imzalı bir JWT duruyor; süresi dolmamışsa doğrudan kullanılabilir.
  en: A signed JWT sits in the source; if it has not expired it can be used directly.
impact:
  tr: Token sahibinin yetkileriyle erişim.
  en: Access with the token owner's privileges.
fix_steps:
  tr:
  - Token'ı koddan kaldırın ve iptal edin (imza anahtarını döndürerek).
  - Testlerde dinamik olarak üretilen kısa ömürlü token kullanın.
  en:
  - Remove the token and revoke it (by rotating the signing key).
  - Generate short-lived tokens dynamically in tests.
verify:
  tr: Düzeltmeden sonra yeniden tarayın; bu madde 'Düzeltildi' olarak görünmeli.
  en: Re-scan after fixing; this item should show up as 'Fixed'.
references:
- type: cwe
  id: 798
- type: owasp
  id: A07:2025
- type: asvs
  id: 5.0-V9
effort: S
