rule_id: DAST-HTTPS-001
title:
  tr: Uygulama HTTPS olmadan sunuluyor
  en: App served without HTTPS
severity: info
category: security
confidence: high
why:
  tr: Uygulama yerelde düz HTTP ile çalışıyor. Yerelde bu normaldir, ancak yayında mutlaka HTTPS kullanılmalı ve HSTS ile
    zorlanmalıdır; aksi halde trafiği dinlenebilir.
  en: The app runs over plain HTTP locally. That is fine locally, but in production it must use HTTPS and enforce it with
    HSTS; otherwise traffic can be intercepted.
fix_steps:
  tr:
  - Yayında bir ters vekil (nginx/Caddy) veya platform ile HTTPS sonlandırın.
  - HTTP'yi HTTPS'e yönlendirin ve HSTS başlığı ekleyin.
  en:
  - Terminate HTTPS in production with a reverse proxy (nginx/Caddy) or your platform.
  - Redirect HTTP to HTTPS and send an HSTS header.
snippets:
  nginx:
    lang: nginx
    code: server { listen 80; return 308 https://$host$request_uri; }
verify:
  tr: Düzeltip uygulamayı yeniden başlatın ve taramayı tekrarlayın; bu madde 'Düzeltildi' olmalı.
  en: Fix it, restart the app and re-scan; this item should show up as 'Fixed'.
references:
- type: cwe
  id: 319
- type: owasp
  id: A04:2025
effort: S
