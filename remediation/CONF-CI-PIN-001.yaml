rule_id: CONF-CI-PIN-001
title:
  tr: Yetkili CI işinde üçüncü taraf action sabitlenmemiş
  en: Third-party action not pinned in a privileged CI job
severity: medium
category: security
confidence: high
why:
  tr: Sırlara, yazma yetkisine veya dış tetikleyiciye sahip bir işte üçüncü taraf action etiket (@v1) veya dal ile
    çağrılıyor. Etiketin sahibi ya da onu ele geçiren biri kodu değiştirirse işiniz o kodu sırlarınızla çalıştırır.
  en: A job with secrets, write permissions or an external trigger calls a third-party action by tag (@v1) or branch.
    If its owner, or someone who compromises it, moves the tag, your job runs that code with your secrets.
impact:
  tr: Tedarik zinciri saldırısıyla sır çalma (ör. 2025 tj-actions/changed-files olayı).
  en: Secret theft through a supply-chain attack (e.g. the 2025 tj-actions/changed-files incident).
fix_steps:
  tr:
  - Action'ı tam 40 karakterlik commit SHA'sı ile sabitleyin, sürümü yorum olarak yazın.
  - Dependabot ile SHA güncellemelerini otomatik takip edin.
  en:
  - Pin the action to its full 40-character commit SHA and note the version in a comment.
  - Let Dependabot keep the SHA pins up to date.
snippets:
  github:
    lang: yaml
    code: '- uses: some-org/some-action@8f4b7f84864484a7bf31766abe9204da3cbe65b3  # v4.1.0'
verify:
  tr: Düzeltmeden sonra yeniden tarayın; bu madde 'Düzeltildi' olarak görünmeli.
  en: Re-scan after fixing; this item should show up as 'Fixed'.
references:
- type: cwe
  id: 829
- type: owasp
  id: A03:2025
- type: url
  href: https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions
effort: S
