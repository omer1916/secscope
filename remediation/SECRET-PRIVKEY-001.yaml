rule_id: SECRET-PRIVKEY-001
title:
  tr: Özel anahtar (private key) depoda
  en: Private key committed
severity: critical
category: security
confidence: high
why:
  tr: Depoda bir özel anahtar bloğu var.
  en: A private key block is present in the repository.
impact:
  tr: TLS/SSH kimliğinin taklit edilmesi, şifreli verinin çözülmesi.
  en: Impersonation of the TLS/SSH identity, decryption of protected data.
fix_steps:
  tr:
  - Anahtar çiftini yenileyin ve eski açık anahtarı iptal edin.
  - Anahtarı depodan ve geçmişten silin; .gitignore'a *.pem/*.key ekleyin.
  en:
  - Replace the key pair and revoke the old public key.
  - Delete the key from the repository and its history; add *.pem/*.key to .gitignore.
verify:
  tr: Düzeltmeden sonra yeniden tarayın; bu madde 'Düzeltildi' olarak görünmeli.
  en: Re-scan after fixing; this item should show up as 'Fixed'.
references:
- type: cwe
  id: 321
- type: owasp
  id: A04:2025
- type: asvs
  id: 5.0-V11
effort: M
