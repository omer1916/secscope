rule_id: SEO-JSONLD-003
title:
  tr: Yapısal veri (JSON-LD) yok
  en: No structured data (JSON-LD)
severity: low
category: seo
confidence: medium
why:
  tr: Organization/WebSite gibi temel işaretlemeler Google'ın siteyi anlamasına yardım eder; zengin sonuç
    garantisi yoktur.
  en: Basic markup like Organization/WebSite helps Google understand the site; rich results are not guaranteed.
fix_steps:
  tr:
  - SecScope'un ürettiği JSON-LD şablonunu doğrulayıp ana sayfaya ekleyin.
  en:
  - Review the JSON-LD template generated by SecScope and add it to the home page.
verify:
  tr: Düzeltmeden sonra yeniden tarayın; yayından sonra Search Console > URL Denetimi ile doğrulayın.
  en: Re-scan after fixing; after launch confirm with Search Console > URL Inspection.
references:
- type: url
  href: https://developers.google.com/search/docs/appearance/structured-data/organization
effort: S
