rule_id: CONF-DOCKER-SECRET-001
title:
  tr: Sır Dockerfile'da ENV/ARG ile veriliyor
  en: Secret passed via Dockerfile ENV/ARG
severity: high
category: security
confidence: high
why:
  tr: ENV/ARG değerleri imaj katmanlarında ve docker history'de kalır.
  en: ENV/ARG values persist in image layers and docker history.
impact:
  tr: İmajı çeken herkesin sırrı okuması.
  en: Anyone pulling the image can read the secret.
fix_steps:
  tr:
  - Derleme sırları için BuildKit --mount=type=secret kullanın; çalışma zamanı sırlarını ortamdan verin.
  en:
  - Use BuildKit --mount=type=secret for build secrets; inject runtime secrets via the environment.
snippets:
  docker:
    lang: dockerfile
    code: RUN --mount=type=secret,id=npmrc,target=/root/.npmrc npm ci
verify:
  tr: Düzeltmeden sonra yeniden tarayın; bu madde 'Düzeltildi' olarak görünmeli.
  en: Re-scan after fixing; this item should show up as 'Fixed'.
references:
- type: cwe
  id: 538
- type: owasp
  id: A02:2025
- type: asvs
  id: 5.0-V13
effort: S
