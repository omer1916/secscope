rule_id: SECRET-DBURL-001
title:
  tr: Bağlantı adresinde parola
  en: Password inside a connection URL
severity: high
category: security
confidence: high
why:
  tr: Veritabanı/servis bağlantı dizesi kullanıcı adı ve parola içeriyor.
  en: A database/service connection string embeds a username and password.
impact:
  tr: Veritabanına doğrudan erişim.
  en: Direct access to the database.
fix_steps:
  tr:
  - Anahtarı/parolayı hemen iptal edip yenisini üretin (rotate) — depoya girdiyse sızmış kabul edin.
  - Değeri koddan çıkarıp ortam değişkeni veya sır yöneticisinden okuyun.
  - Git geçmişinden temizleyin (git filter-repo) ve depoyu klonlayan herkese bildirin.
  en:
  - Revoke the key/password immediately and issue a new one (rotate) — once committed, treat it as leaked.
  - Remove the value from code and read it from an environment variable or a secret manager.
  - Purge it from git history (git filter-repo) and tell everyone who cloned the repository.
snippets:
  python:
    lang: python
    code: DATABASE_URL = os.environ["DATABASE_URL"]
  express:
    lang: js
    code: const url = process.env.DATABASE_URL;
verify:
  tr: Düzeltmeden sonra yeniden tarayın; bu madde 'Düzeltildi' olarak görünmeli.
  en: Re-scan after fixing; this item should show up as 'Fixed'.
references:
- type: cwe
  id: 798
- type: owasp
  id: A07:2025
- type: asvs
  id: 5.0-V13
- type: url
  href: https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
effort: S
