rule_id: SAST-XSS-003
title:
  tr: Şablonda otomatik kaçışlama kapatılmış
  en: Template auto-escaping disabled
severity: high
category: security
confidence: medium
why:
  tr: '|safe, autoescape false, <%- %>, {{{ }}}, Markup()/mark_safe() veya echo $_GET değeri HTML olarak
    çıktılar.'
  en: '|safe, autoescape false, <%- %>, {{{ }}}, Markup()/mark_safe() or echo $_GET output the value as
    HTML.'
impact:
  tr: Değer kullanıcıdan geliyorsa XSS.
  en: XSS if the value comes from users.
fix_steps:
  tr:
  - Kaçışlamayı açık bırakın; |safe yalnızca güvenilir, sunucuda üretilmiş HTML için.
  - PHP'de htmlspecialchars($v, ENT_QUOTES, 'UTF-8') kullanın.
  en:
  - Keep escaping on; use |safe only for trusted server-generated HTML.
  - In PHP use htmlspecialchars($v, ENT_QUOTES, 'UTF-8').
snippets:
  flask:
    lang: jinja
    code: '<p>{{ comment }}</p>  {# no |safe #}'
  php:
    lang: php
    code: echo htmlspecialchars($_GET['q'], ENT_QUOTES, 'UTF-8');
  express:
    lang: ejs
    code: <p><%= comment %></p>  <%# escaped; avoid <%- %> %>
verify:
  tr: Düzeltmeden sonra yeniden tarayın; bu madde 'Düzeltildi' olarak görünmeli.
  en: Re-scan after fixing; this item should show up as 'Fixed'.
references:
- type: cwe
  id: 79
- type: owasp
  id: A05:2025
- type: asvs
  id: 5.0-V1
- type: url
  href: https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
effort: S
