rule_id: SEO-SITEMAP-001
title:
  tr: sitemap.xml yok veya robots.txt'de bildirilmemiş
  en: sitemap.xml missing or not declared
severity: high
category: seo
confidence: high
why:
  tr: Site haritası Google'a hangi sayfaların önemli olduğunu ve ne zaman değiştiğini söyler.
  en: A sitemap tells Google which pages matter and when they changed.
fix_steps:
  tr:
  - SecScope'un ürettiği sitemap.xml taslağını yayınlayın.
  - 'robots.txt''ye ''Sitemap: https://.../sitemap.xml'' ekleyin ve Search Console''a gönderin.'
  en:
  - Publish the sitemap.xml draft generated by SecScope.
  - 'Add ''Sitemap: https://.../sitemap.xml'' to robots.txt and submit it in Search Console.'
verify:
  tr: Düzeltmeden sonra yeniden tarayın; yayından sonra Search Console > URL Denetimi ile doğrulayın.
  en: Re-scan after fixing; after launch confirm with Search Console > URL Inspection.
references:
- type: url
  href: https://developers.google.com/search/docs/crawling-indexing/sitemaps/build-sitemap
effort: S
