rule_id: SECRET-ENV-001
title:
  tr: .env dosyası projede bulunuyor
  en: .env file present in the project
severity: high
category: security
confidence: high
why:
  tr: .env dosyaları genellikle gerçek sırlar içerir; depoya veya dağıtım paketine girmemelidir.
  en: .env files usually hold real secrets and must not enter the repository or the deployment bundle.
impact:
  tr: İçindeki tüm sırların sızması.
  en: Leak of every secret inside it.
fix_steps:
  tr:
  - .env dosyasını depodan kaldırıp .gitignore'a ekleyin.
  - Değerleri içeren bir .env.example (değersiz) paylaşın.
  - İçindeki sırları döndürün.
  en:
  - Remove .env from the repository and add it to .gitignore.
  - Share a .env.example without values instead.
  - Rotate the secrets it contained.
verify:
  tr: Düzeltmeden sonra yeniden tarayın; bu madde 'Düzeltildi' olarak görünmeli.
  en: Re-scan after fixing; this item should show up as 'Fixed'.
references:
- type: cwe
  id: 538
- type: owasp
  id: A02:2025
- type: asvs
  id: 5.0-V13
effort: S
