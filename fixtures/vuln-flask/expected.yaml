# Rule ids a scan of this fixture must report (recall is measured against `must`).
# A rule also counts as found when it appears in another finding's related_rules (dedup).
static:
  must:
    - SAST-SQLI-001        # /search string concatenation
    - SAST-XSS-004         # /hello and /search build HTML with request data
    - SAST-DEBUG-001       # app.run(debug=True)
    - SAST-HARDCODED-001   # app.secret_key literal
    - SAST-JWT-001         # config.JWT_SECRET = "secret"
    - SAST-REDIRECT-001    # /go
    - SAST-PATH-001        # /download
    - SAST-COOKIE-001      # set_cookie without flags
    - SAST-CORS-001        # origin reflection
    - SAST-ERRLEAK-001     # traceback in /crash
    - SAST-EXPOSE-001      # static_folder="."
    - SECRET-CLOUD-001     # fake AWS keys in config.py
    - SECRET-TOKEN-001     # fake Stripe key in .env
    - SECRET-DBURL-001     # DATABASE_URL with password
    - SECRET-ENV-001       # committed .env
    - CONF-BACKUP-001      # app.py.bak
    - CONF-GITIGNORE-001   # .env not ignored
  needs_db:
    - SCA-VULN-001         # flask 2.2.2, werkzeug 2.2.3, pyjwt 2.4.0
  may:
    - SECRET-GENERIC-001
    - QUAL-DEFAULTCRED-001
